# If you are confused about this command definition, cause you was
# reading other suggestions, please have a look into
# /usr/share/doc/monitoring-plugins/README.Debian

# 'check_nt' command definition
define command {
	command_name    check_nt
	command_line    /usr/lib/nagios/plugins/check_nt -H '$HOSTADDRESS$' -v '$ARG1$'
}

# 'check_nscp' command definition
define command {
	command_name	check_nscp
	command_line	/usr/lib/nagios/plugins/check_nt -H '$HOSTADDRESS$' -p 12489 -v '$ARG1$'
}


define command{
command_name check_nt_disk
command_line  /usr/lib/nagios/plugins/check_nt -H $HOSTADDRESS$ -s eleve -p 12489 -v USEDDISKSPACE -l $ARG1$ -w $ARG2$ -c $ARG3$
}

define command{
command_name check_nt_cpuload
command_line /usr/lib/nagios/plugins/check_nt -H $HOSTADDRESS$ -s eleve -p 12489 -v CPULOAD -l $ARG1$
}
