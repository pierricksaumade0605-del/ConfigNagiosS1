define host {
    use                     cisco-router
    host_name               Cisco-891F
    alias                   Routeur Cisco 891F
    address                 10.46.50.254
}
# Service ping
define service {
    host_name               Cisco-891F
    service_description     PING
    check_command           check_ping!100.0,20%!500.0,60%
    max_check_attempts      5
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    contact_groups          admins
}

# Service SNMP - Interface WAN (192.168.46.254)
define service {
    host_name               Cisco-891F
    service_description     Interface-WAN
    check_command           check_snmp!-C public -o ifOperStatus.1
    max_check_attempts      5
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    contact_groups          admins
}

# Service SNMP - Interface LAN VLAN Nagios (10.46.50.254)
define service {
    host_name               Cisco-891F
    service_description     Interface-LAN-Nagios
    check_command           check_snmp!-C public -o ifOperStatus.2
    max_check_attempts      5
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    contact_groups          admins
}

# Service CPU
define service {
    host_name               Cisco-891F
    service_description     CPU-Load
    check_command           check_snmp!-C public -o cpmCPUTotal5min.1 -w 80 -c 90
    max_check_attempts      5
    check_interval          5
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    contact_groups          admins
}

